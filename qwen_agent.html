<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Полный курс Python</title>
<style>
/* ============ RESET & BASE ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e27;--bg2:#131836;--bg3:#1c2240;
  --panel:#161b38;--panel2:#1d2347;
  --text:#e6e9f5;--text-dim:#9aa3c7;--text-muted:#6b7299;
  --accent:#4dabf7;--accent2:#7c5cff;--success:#51cf66;--danger:#ff6b6b;--warn:#ffd43b;
  --border:#262c4d;--code-bg:#0f1330;
  --sidebar:280px;
}
html.light{
  --bg:#f5f7fb;--bg2:#ffffff;--bg3:#eef1f8;
  --panel:#ffffff;--panel2:#f5f7fb;
  --text:#1a1d29;--text-dim:#5a6178;--text-muted:#8b91a8;
  --accent:#1971c2;--accent2:#6741d9;--success:#099268;--danger:#e03131;--warn:#f08c00;
  --border:#dee2ed;--code-bg:#f1f3f9;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* ============ HEADER ============ */
header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  height:60px;display:flex;align-items:center;padding:0 20px;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--accent);cursor:pointer}
.logo .badge{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:3px 8px;border-radius:6px;font-size:13px}
.header-nav{margin-left:auto;display:flex;align-items:center;gap:16px}
.progress-ring{width:42px;height:42px;position:relative}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring circle{fill:none;stroke-width:4}
.progress-ring .bg{stroke:var(--border)}
.progress-ring .fg{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset .5s}
.progress-ring .txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700}
.theme-toggle{background:var(--bg3);color:var(--text);padding:8px 12px;border-radius:8px;font-size:14px}
.theme-toggle:hover{background:var(--accent);color:#fff}
.btn-ico{background:var(--bg3);color:var(--text);width:38px;height:38px;border-radius:8px;font-size:18px}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:calc(100vh - 60px)}
.sidebar{
  width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;height:calc(100vh - 60px);position:sticky;top:60px;flex-shrink:0;
  transition:transform .3s;
}
.sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar)));position:fixed}
.module{border-bottom:1px solid var(--border)}
.module-head{
  padding:14px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;
  font-weight:600;font-size:14px;transition:background .15s;
}
.module-head:hover{background:var(--bg3)}
.module-head .num{
  width:24px;height:24px;border-radius:50%;background:var(--bg3);color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;
}
.module.done .num{background:var(--success);color:#fff}
.module.active .num{background:var(--accent);color:#fff}
.module-head .chev{margin-left:auto;transition:transform .2s;color:var(--text-muted)}
.module.open .chev{transform:rotate(90deg)}
.module-body{display:none;background:var(--bg)}
.module.open .module-body{display:block}
.lesson{
  padding:10px 18px 10px 52px;font-size:13px;color:var(--text-dim);cursor:pointer;
  border-left:3px solid transparent;transition:all .15s;
}
.lesson:hover{background:var(--bg3);color:var(--text)}
.lesson.active{border-left-color:var(--accent);background:var(--bg3);color:var(--text);font-weight:600}
.lesson .check{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--border);margin-right:8px;vertical-align:middle}
.lesson.done .check{background:var(--success);border-color:var(--success)}
.lesson.done .check:after{content:'✓';color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;height:100%}

/* ============ MAIN ============ */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content-area{display:flex;flex:1;min-height:0}
.lesson-pane{flex:1;padding:30px 40px;overflow-y:auto;max-width:900px}
.editor-pane{
  width:46%;min-width:380px;background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:60px;height:calc(100vh - 60px);
}
.lesson-title{font-size:28px;font-weight:800;margin-bottom:6px;color:var(--text)}
.lesson-meta{color:var(--text-muted);font-size:13px;margin-bottom:24px;display:flex;gap:14px;align-items:center}
.lesson-meta .dot{width:6px;height:6px;background:var(--text-muted);border-radius:50%}
.lesson-body{font-size:15px;color:var(--text);line-height:1.75}
.lesson-body h2{font-size:22px;margin:28px 0 14px;color:var(--text);font-weight:700}
.lesson-body h3{font-size:18px;margin:22px 0 10px;color:var(--text);font-weight:600}
.lesson-body p{margin-bottom:14px}
.lesson-body ul,.lesson-body ol{margin:12px 0 14px 22px}
.lesson-body li{margin-bottom:6px}
.lesson-body code{background:var(--code-bg);padding:2px 6px;border-radius:4px;font-family:'Consolas','Monaco',monospace;font-size:13px;color:var(--accent)}
.lesson-body pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:12px 0}
.lesson-body pre code{background:none;padding:0;color:var(--text);font-size:13.5px}
.lesson-body .tip{background:rgba(77,171,247,.08);border-left:3px solid var(--accent);padding:12px 16px;border-radius:6px;margin:14px 0}
.lesson-body .warn{background:rgba(255,212,59,.08);border-left:3px solid var(--warn);padding:12px 16px;border-radius:6px;margin:14px 0}
.lesson-body .tip strong{color:var(--accent)}
.lesson-body .warn strong{color:var(--warn)}
.lesson-body table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px}
.lesson-body th,.lesson-body td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.lesson-body th{background:var(--bg3);font-weight:600}

/* ============ EDITOR ============ */
.editor-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border)}
.editor-tab{padding:10px 18px;font-size:13px;color:var(--text-dim);border-right:1px solid var(--border);cursor:pointer;font-weight:500}
.editor-tab.active{color:var(--accent);border-bottom:2px solid var(--accent);background:var(--panel)}
.editor-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.editor-area{flex:1;background:var(--code-bg);color:var(--text);font-family:'Consolas','Monaco',monospace;font-size:14px;line-height:1.6;padding:14px;border:none;resize:none;outline:none;white-space:pre;tab-size:4}
.editor-area::selection{background:rgba(124,92,255,.3)}
.editor-toolbar{display:flex;align-items:center;padding:8px 12px;background:var(--bg2);border-top:1px solid var(--border);gap:8px}
.btn{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn-run{background:var(--success);color:#fff}
.btn-run:hover{filter:brightness(1.1)}
.btn-reset{background:var(--bg3);color:var(--text)}
.btn-reset:hover{background:var(--border)}
.btn-hint{background:var(--warn);color:#000}
.btn-hint:hover{filter:brightness(1.05)}
.btn-solution{background:var(--bg3);color:var(--text-dim)}
.btn-solution:hover{color:var(--text)}
.editor-status{margin-left:auto;font-size:12px;color:var(--text-muted);display:flex;gap:14px;align-items:center}
#pyStatus{padding:3px 8px;border-radius:4px;font-size:11px}
#pyStatus.loading{background:var(--warn);color:#000}
#pyStatus.ready{background:var(--success);color:#fff}
#pyStatus.idle{background:var(--bg3);color:var(--text-muted)}

.output-wrap{height:38%;min-height:160px;background:var(--bg);border-top:2px solid var(--border);display:flex;flex-direction:column}
.output-head{padding:8px 14px;background:var(--bg2);font-size:12px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.output-head .clear{cursor:pointer;color:var(--text-muted)}
.output-head .clear:hover{color:var(--danger)}
.output-area{flex:1;overflow-y:auto;padding:12px 14px;font-family:'Consolas',monospace;font-size:13px;line-height:1.5}
.output-area .out{color:var(--text)}
.output-area .err{color:var(--danger)}
.output-area .ok{color:var(--success)}
.output-area .info{color:var(--text-muted);font-style:italic}
.test-results{border-top:1px solid var(--border);padding:8px 14px;max-height:35%;overflow-y:auto}
.test-results h4{font-size:12px;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.test-item{font-size:12px;padding:4px 0;display:flex;align-items:center;gap:8px;font-family:monospace}
.test-item .icon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.test-item.pass .icon{background:var(--success);color:#fff}
.test-item.fail .icon{background:var(--danger);color:#fff}

/* ============ ACTIONS BAR ============ */
.actions-bar{
  display:flex;justify-content:space-between;align-items:center;padding:18px 40px;
  border-top:1px solid var(--border);background:var(--bg2);margin-top:30px;
}
.btn-nav{padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600}
.btn-prev{background:var(--bg3);color:var(--text)}
.btn-prev:hover{background:var(--border)}
.btn-next{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-next:hover{filter:brightness(1.1)}
.btn-next:disabled{opacity:.4;cursor:not-allowed}

/* ============ WELCOME / DASHBOARD ============ */
.welcome{padding:40px;max-width:1100px;margin:0 auto}
.welcome h1{font-size:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.welcome .sub{color:var(--text-dim);font-size:17px;margin-bottom:34px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:34px}
.dash-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;transition:transform .15s}
.dash-card:hover{transform:translateY(-2px)}
.dash-card .icon{font-size:26px;margin-bottom:8px}
.dash-card .val{font-size:28px;font-weight:800;color:var(--accent)}
.dash-card .lbl{color:var(--text-dim);font-size:13px}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mod-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .15s}
.mod-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.mod-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mod-card .top .num{font-size:24px;font-weight:800;color:var(--accent)}
.mod-card .top .pct{font-size:12px;color:var(--text-muted)}
.mod-card h3{font-size:17px;margin-bottom:6px}
.mod-card p{color:var(--text-dim);font-size:13px;margin-bottom:12px}
.mod-card .bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.mod-card .bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}

/* ============ CERTIFICATE ============ */
.cert-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.cert-modal.open{display:flex}
.cert-card{
  background:linear-gradient(135deg,#fff,#f0f4ff);border:8px solid #d4af37;border-radius:12px;
  padding:50px;width:800px;max-width:100%;text-align:center;position:relative;color:#1a1d29;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.cert-card .seal{position:absolute;top:20px;right:20px;width:80px;height:80px;background:#d4af37;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px}
.cert-card h1{font-size:32px;color:#1971c2;margin-bottom:8px}
.cert-card .sub{color:#5a6178;font-size:14px;margin-bottom:30px;text-transform:uppercase;letter-spacing:2px}
.cert-card .name{font-size:42px;font-weight:800;color:#1a1d29;margin:14px 0;font-family:Georgia,serif}
.cert-card .desc{color:#5a6178;font-size:14px;margin:20px 0;line-height:1.6}
.cert-card .date{margin-top:30px;color:#5a6178;font-size:13px}
.cert-card .sig{margin-top:40px;display:flex;justify-content:space-around;font-size:12px;color:#5a6178}
.cert-card .sig div{border-top:1px solid #aaa;padding-top:6px;min-width:180px}
.cert-close{position:absolute;top:-40px;right:0;background:#fff;color:#000;width:36px;height:36px;border-radius:50%;font-size:18px}

/* ============ ACHIEVEMENTS ============ */
.achv-toast{position:fixed;bottom:30px;right:30px;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:16px 20px;display:flex;gap:14px;align-items:center;z-index:999;box-shadow:0 10px 40px rgba(0,0,0,.4);transform:translateX(420px);transition:transform .4s}
.achv-toast.show{transform:translateX(0)}
.achv-toast .ic{font-size:30px}
.achv-toast .tt{font-weight:700;font-size:14px}
.achv-toast .ds{font-size:12px;color:var(--text-dim)}

/* ============ MOBILE ============ */
.menu-toggle{display:none;background:var(--bg3);color:var(--text);width:38px;height:38px;border-radius:8px;font-size:18px}
@media(max-width:900px){
  :root{--sidebar:260px}
  .editor-pane{width:100%;min-width:0;position:relative;height:auto;border-left:none;border-top:1px solid var(--border)}
  .content-area{flex-direction:column}
  .lesson-pane{padding:20px}
  .sidebar{position:fixed;z-index:200;transform:translateX(calc(-1 * var(--sidebar)))}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:block}
  .actions-bar{padding:14px 20px}
  .welcome{padding:24px 20px}
  .welcome h1{font-size:28px}
}
.fade{opacity:.4;pointer-events:none}
.loader{border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;width:16px;height:16px;display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tooltip{position:relative}
.tooltip:hover::after{content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;z-index:10}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header>
  <button class="menu-toggle" id="menuToggle">☰</button>
  <div class="logo" onclick="showDashboard()">
    <span>🐍 Py</span><span class="badge">Camp</span>
  </div>
  <div class="header-nav">
    <div class="progress-ring">
      <svg width="42" height="42">
        <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4dabf7"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
        <circle class="bg" cx="21" cy="21" r="17"></circle>
        <circle class="fg" id="progRing" cx="21" cy="21" r="17" stroke-dasharray="106.8" stroke-dashoffset="106.8"></circle>
      </svg>
      <div class="txt" id="progPct">0%</div>
    </div>
    <button class="btn-ico tooltip" data-tip="Достижения" onclick="showAchievements()">🏆</button>
    <button class="btn-ico tooltip" data-tip="Сертификат" onclick="showCert()">🎓</button>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<!-- ============ APP ============ -->
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div id="curriculum"></div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div id="mainContent"></div>
  </main>
</div>

<!-- ============ CERTIFICATE MODAL ============ -->
<div class="cert-modal" id="certModal">
  <div class="cert-card" id="certCard">
    <button class="cert-close" onclick="closeCert()">×</button>
    <div class="seal">🐍</div>
    <h1>PyCamp</h1>
    <div class="sub">Сертификат об успешном прохождении</div>
    <div class="name" id="certName">Студент</div>
    <div class="desc">Успешно завершил(а) полный курс программирования на языке Python, охватывающий основы языка, структуры данных, ООП, обработку исключений и продвинутые концепции.</div>
    <div class="date" id="certDate"></div>
    <div class="sig"><div>PyCamp Academy</div><div>Главный инструктор</div></div>
  </div>
</div>

<!-- ============ ACHIEVEMENT TOAST ============ -->
<div class="achv-toast" id="achvToast">
  <div class="ic" id="achvIcon">🏆</div>
  <div><div class="tt" id="achvTitle">Достижение!</div><div class="ds" id="achvDesc"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<script>
/* ============================================================
   PyCamp — Полный курс Python
   Аналог freeCodeCamp в одном файле
   ============================================================ */

/* ============ 1. КУРРИКУЛУМ ============ */
const CURRICULUM = [
  {
    id:'m1', title:'Основы Python', icon:'🌱',
    desc:'Переменные, типы данных, строки, числа, ввод/вывод',
    lessons:[
      {id:'m1l1', title:'Что такое Python?', type:'theory'},
      {id:'m1l2', title:'Hello World и print()', type:'practice'},
      {id:'m1l3', title:'Переменные и типы данных', type:'practice'},
      {id:'m1l4', title:'Строки и f-strings', type:'practice'},
      {id:'m1l5', title:'Числа и математика', type:'practice'},
      {id:'m1l6', title:'Ввод данных: input()', type:'practice'},
      {id:'m1l7', title:'Логические значения и None', type:'practice'}
    ]
  },
  {
    id:'m2', title:'Структуры данных', icon:'📦',
    desc:'Списки, кортежи, словари, множества',
    lessons:[
      {id:'m2l1', title:'Списки: основы', type:'practice'},
      {id:'m2l2', title:'Методы списков', type:'practice'},
      {id:'m2l3', title:'Срезы списков', type:'practice'},
      {id:'m2l4', title:'Кортежи', type:'practice'},
      {id:'m2l5', title:'Словари', type:'practice'},
      {id:'m2l6', title:'Множества', type:'practice'},
      {id:'m2l7', title:'Генераторы списков', type:'practice'}
    ]
  },
  {
    id:'m3', title:'Управляющие конструкции', icon:'🔀',
    desc:'Условия, циклы, ветвление',
    lessons:[
      {id:'m3l1', title:'Условия if/elif/else', type:'practice'},
      {id:'m3l2', title:'Логические операторы', type:'practice'},
      {id:'m3l3', title:'Цикл for', type:'practice'},
      {id:'m3l4', title:'Цикл while', type:'practice'},
      {id:'m3l5', title:'break и continue', type:'practice'},
      {id:'m3l6', title:'Вложенные циклы', type:'practice'}
    ]
  },
  {
    id:'m4', title:'Функции', icon:'🔧',
    desc:'Определение, аргументы, возврат, рекурсия',
    lessons:[
      {id:'m4l1', title:'Определение функций', type:'practice'},
      {id:'m4l2', title:'Аргументы и параметры', type:'practice'},
      {id:'m4l3', title:'Возврат значений', type:'practice'},
      {id:'m4l4', title:'Аргументы по умолчанию', type:'practice'},
      {id:'m4l5', title:'*args и **kwargs', type:'practice'},
      {id:'m4l6', title:'Lambda-функции', type:'practice'},
      {id:'m4l7', title:'Рекурсия', type:'practice'}
    ]
  },
  {
    id:'m5', title:'Строки и обработка', icon:'📝',
    desc:'Методы строк, форматирование, регулярки',
    lessons:[
      {id:'m5l1', title:'Методы строк', type:'practice'},
      {id:'m5l2', title:'Форматирование строк', type:'practice'},
      {id:'m5l3', title:'Split, join, replace', type:'practice'},
      {id:'m5l4', title:'Проверка строк', type:'practice'}
    ]
  },
  {
    id:'m6', title:'ООП', icon:'🏛️',

<h2>Рекурсивные функции</h2>
<p><strong>Рекурсия</strong> — это когда функция вызывает саму себя. Используется для задач, которые можно разбить на подзадачи того же типа.</p>

<h3>Факториал</h3>
<pre><code>def factorial(n):
    if n <= 1:        # базовый случай

<h2>Виды методов</h2>
<p>В классах Python есть три типа методов:</p>

<h3>1. Обычные методы (instance methods)</h3>
<p>Принимают <code>self</code> как первый аргумент — работают с атрибутами объекта.</p>
<pre><code>class Counter:
    def __init__(self):
        self.count = 0

    def increment(self):
        self.count += 1

    def get(self):
        return self.count</code></pre>

<h3>2. Методы класса (@classmethod)</h3>
<p>Принимают <code>cls</code> — сам класс. Часто используются как альтернативные конструкторы.</p>
<pre><code>class User:
    def __init__(self, name, age):
        self.name = name
        self.age = age

    @classmethod
    def from_string(cls, data):
        name, age = data.split(",")
        return cls(name, int(age))

u = User.from_string("Анна,25")
print(u.name, u.age)  # Анна 25</code></pre>

<h3>3. Статические методы (@staticmethod)</h3>
<p>Не принимают self или cls — логически связаны с классом, но не требуют доступа к нему.</p>
<pre><code>class MathHelper:
    @staticmethod
    def square(x):
        return x ** 2

    @staticmethod
    def cube(x):
        return x ** 3

print(MathHelper.square(5))  # 25</code></pre>

<h3>Комбинированный пример</h3>
<pre><code>class BankAccount:
    interest_rate = 0.05  # атрибут класса

    def __init__(self, owner, balance=0):
        self.owner = owner
        self.balance = balance

    def deposit(self, amount):  # instance
        self.balance += amount

    @classmethod
    def from_dict(cls, data):  # class
        return cls(data["owner"], data["balance"])

    @staticmethod
    def validate_amount(amount):  # static
        return amount > 0</code></pre>

<h2>Наследование</h2>
<p><strong>Наследование</strong> позволяет создавать новые классы на основе существующих. Дочерний класс получает все атрибуты и методы родительского.</p>

<h3>Базовое наследование</h3>
<pre><code>class Animal:
    def __init__(self, name):
        self.name = name

    def speak(self):

class Dog(Animal):  # Dog наследует Animal

<h3>Вызов родительского метода через super()</h3>
<pre><code>class Animal:
    def __init__(self, name, age):
        self.name = name
        self.age = age
        print("Animal создан")

class Dog(Animal):
    def __init__(self, name, age, breed):
        super().__init__(name, age)  # вызов родителя
        self.breed = breed
        print("Dog создан")

d = Dog("Бобик", 3, "Дворняга")
# Animal создан
# Dog создан
print(d.name, d.age, d.breed)</code></pre>

<h3>Множественное наследование</h3>

class Swimmer:

class Duck(Flyable, Swimmer):

d = Duck()
d.fly()   # Летит!
d.swim()  # Плывёт!</code></pre>

<h3>Пример с животными</h3>
<pre><code>class Dog:

<h3>Утиная типизация (Duck Typing)</h3>
<p>Python не проверяет тип — только наличие нужного метода: <em>"Если это выглядит как утка, крякает как утка — это утка"</em>.</p>
<pre><code>class FileLike:

class NetworkLike:

def process_data(source):

<h3>Абстрактные базовые классы</h3>

<pre><code>from abc import ABC, abstractmethod

class Shape(ABC):
    @abstractmethod

<pre><code>class Vector:

    body:`
<h2>Dunder methods</h2>
<p><strong>Магические методы</strong> (dunder — от double underscore) — это методы с двумя подчёркиваниями в начале и конце. Они определяют поведение объектов в различных ситуациях.</p>

<h3>Основные магические методы</h3>
<table>
<tr><th>Метод</th><th>Когда вызывается</th></tr>
<tr><td><code>__init__</code></td><td>При создании объекта</td></tr>
<tr><td><code>__str__</code></td><td>str(obj) или print(obj)</td></tr>
<tr><td><code>__repr__</code></td><td>repr(obj), в REPL</td></tr>
<tr><td><code>__len__</code></td><td>len(obj)</td></tr>
<tr><td><code>__eq__</code></td><td>obj == other</td></tr>
<tr><td><code>__lt__</code></td><td>obj &lt; other</td></tr>
<tr><td><code>__add__</code></td><td>obj + other</td></tr>
<tr><td><code>__getitem__</code></td><td>obj[key]</td></tr>
<tr><td><code>__contains__</code></td><td>x in obj</td></tr>
</table>

<h3>Полный пример класса</h3>
<pre><code>class Inventory:
    def __init__(self, items=None):
        self.items = items or []

    def __len__(self):
        return len(self.items)

    def __str__(self):
        return f"Inventory({self.items})"

    def __repr__(self):
        return f"Inventory({self.items!r})"

    def __getitem__(self, idx):
        return self.items[idx]

    def __contains__(self, item):
        return item in self.items

    def __add__(self, other):
        return Inventory(self.items + other.items)

    def __eq__(self, other):
        return self.items == other.items

inv = Inventory(["apple", "banana"])
print(len(inv))           # 2
print(inv[0])             # apple
print("banana" in inv)    # True
print(inv)                # Inventory(['apple', 'banana'])
print(inv + Inventory(["cherry"]))  # Inventory(['apple', 'banana', 'cherry'])</code></pre>

<h3>Итерация</h3>
<pre><code>class Range2:
    def __init__(self, n):
        self.n = n

    def __iter__(self):
        self.i = 0
        return self

    def __next__(self):
        if self.i >= self.n:
            raise StopIteration
        self.i += 1
        return self.i - 1

for x in Range2(5):
    print(x)  # 0, 1, 2, 3, 4</code></pre>

<h3>Callable объекты</h3>
<pre><code>class Multiplier:
    def __init__(self, factor):
        self.factor = factor

    def __call__(self, x):

<tr><td><code>AttributeError</code></td><td>Нет такого атрибута</td></tr>

<tr><td><code>ImportError</code></td><td>Ошибка импорта модуля</td></tr>

<h3>Иерархия</h3>

<h2>Итераторы и итерируемые объекты</h2>
<p><strong>Итератор</strong> — это объект, который реализует методы <code>__iter__()</code> и <code>__next__()</code>. <strong>Итерируемый</strong> — объект, который можно перебрать (список, строка, словарь...).</p>

<h3>Протокол итератора</h3>
<pre><code>class CountDown:
    def __init__(self, start):
        self.current = start

    def __iter__(self):
        return self

    def __next__(self):
        if self.current &lt;= 0:
            raise StopIteration
        self.current -= 1
        return self.current + 1

cd = CountDown(5)

<h3>Полезные itertools</h3>

/* ============ 3. СОСТОЯНИЕ ============ */
let state = {
  currentLesson:null,
  pyodideReady:false,
  pyodideLoading:false,
  completed:JSON.parse(localStorage.getItem('pycamp_completed')||'{}'),
  achievements:JSON.parse(localStorage.getItem('pycamp_achievements')||'[]'),
  studentName:localStorage.getItem('pycamp_name')||'',
  theme:localStorage.getItem('pycamp_theme')||'dark',
  openModules:JSON.parse(localStorage.getItem('pycamp_open')||'["m1"]')
};

/* ============ 4. ИНИЦИАЛИЗАЦИЯ ============ */
function init(){
  applyTheme();
  renderCurriculum();
  updateProgress();

  if(Object.keys(state.completed).length===0&&!state.currentLesson){
    showDashboard();
  }else{
    showDashboard();
  }
}

function applyTheme(){
  document.documentElement.className = state.theme==='light'?'light':'';
  document.getElementById('themeBtn').textContent = state.theme==='light'?'☀️':'🌙';
}

function toggleTheme(){
  state.theme = state.theme==='dark'?'light':'dark';
  localStorage.setItem('pycamp_theme',state.theme);
  applyTheme();
}

/* ============ 5. ПРОГРЕСС ============ */
function countLessons(){
  let n=0;
  CURRICULUM.forEach(m=>n+=m.lessons.length);
  return n;
}
function countCompleted(){
  return Object.keys(state.completed).length;
}
function updateProgress(){
  const total=countLessons();
  const done=countCompleted();
  const pct=Math.round(done/total*100);
  document.getElementById('progPct').textContent=pct+'%';
  const circ=2*Math.PI*17;
  const offset=circ-(pct/100)*circ;
  document.getElementById('progRing').setAttribute('stroke-dashoffset',offset);
  localStorage.setItem('pycamp_completed',JSON.stringify(state.completed));
}
function isLessonDone(id){return !!state.completed[id];}
function markDone(id){
  if(!state.completed[id]){
    state.completed[id]=true;
    updateProgress();
    renderCurriculum();
    checkAchievements();
  }
}
function isModuleDone(mid){
  const m=CURRICULUM.find(x=>x.id===mid);
  return m.lessons.every(l=>isLessonDone(l.id));
}
function moduleProgress(mid){
  const m=CURRICULUM.find(x=>x.id===mid);
  const done=m.lessons.filter(l=>isLessonDone(l.id)).length;
  return Math.round(done/m.lessons.length*100);
}

/* ============ 6. ДОСТИЖЕНИЯ ============ */
const ACHIEVEMENTS=[
  {id:'first',icon:'🎯',title:'Первые шаги',desc:'Завершите первый урок',check:()=>countCompleted()>=1},
  {id:'module1',icon:'🌱',title:'Основатель',desc:'Завершите модуль "Основы"',check:()=>isModuleDone('m1')},
  {id:'modules3',icon:'📦',title:'Структурщик',desc:'Завершите 3 модуля',check:()=>CURRICULUM.filter(m=>isModuleDone(m.id)).length>=3},
  {id:'halfway',icon:'⚡',title:'На полпути',desc:'Завершите 50% курса',check:()=>countCompleted()/countLessons()>=0.5},
  {id:'oop',icon:'🏛️',title:'ООП мастер',desc:'Завершите модуль ООП',check:()=>isModuleDone('m6')},
  {id:'pro',icon:'🚀',title:'Профи',desc:'Завершите продвинутый модуль',check:()=>isModuleDone('m8')},
  {id:'projects',icon:'🏆',title:'Проектёр',desc:'Завершите все проекты',check:()=>isModuleDone('m9')},
  {id:'all',icon:'🎓',title:'Выпускник!',desc:'Завершите весь курс',check:()=>countCompleted()>=countLessons()}
];
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!state.achievements.includes(a.id)&&a.check()){
      state.achievements.push(a.id);
      localStorage.setItem('pycamp_achievements',JSON.stringify(state.achievements));
      showAchievementToast(a);
    }
  });
}
function showAchievementToast(a){
  document.getElementById('achvIcon').textContent=a.icon;
  document.getElementById('achvTitle').textContent=a.title;
  document.getElementById('achvDesc').textContent=a.desc;
  const t=document.getElementById('achvToast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),4000);
}
function showAchievements(){
  const html=`
    <div class="welcome">
      <h1>🏆 Достижения</h1>
      <p class="sub">Заработано: ${state.achievements.length} из ${ACHIEVEMENTS.length}</p>
      <div class="modules-grid">
        ${ACHIEVEMENTS.map(a=>`
          <div class="mod-card" style="opacity:${state.achievements.includes(a.id)?1:0.5}">
            <div class="top"><div class="num" style="font-size:30px">${a.icon}</div></div>
            <h3>${a.title}</h3>
            <p>${a.desc}</p>
            <div class="bar"><div class="fill" style="width:${state.achievements.includes(a.id)?100:0}%"></div></div>
          </div>
        `).join('')}
      </div>
    </div>`;
  document.getElementById('mainContent').innerHTML=html;
}

function showDashboard(){
  state.currentLesson=null;
  const total=countLessons();
  const done=countCompleted();
  const pct=Math.round(done/total*100);
  const html=`
    <div class="welcome">
      <h1>🐍 PyCamp — Полный курс Python</h1>
      <p class="sub">Изучай Python интерактивно — пиши код прямо в браузере, проходи тесты, получай сертификат.</p>

      <div class="dash-grid">
        <div class="dash-card">
          <div class="icon">📚</div>
          <div class="val">${CURRICULUM.length}</div>
          <div class="lbl">Модулей</div>
        </div>
        <div class="dash-card">
          <div class="icon">✅</div>
          <div class="val">${done}/${total}</div>
          <div class="lbl">Уроков пройдено</div>
        </div>
        <div class="dash-card">
          <div class="icon">📈</div>
          <div class="val">${pct}%</div>
          <div class="lbl">Общий прогресс</div>
        </div>
        <div class="dash-card">
          <div class="icon">🏆</div>
          <div class="val">${state.achievements.length}</div>
          <div class="lbl">Достижений</div>
        </div>
      </div>

      <h2 style="margin:30px 0 16px;font-size:24px">Модули курса</h2>
      <div class="modules-grid">
        ${CURRICULUM.map(m=>{
          const p=moduleProgress(m.id);
          const done=isModuleDone(m.id);
          return `
          <div class="mod-card" onclick="openModule('${m.id}'); showFirstLesson('${m.id}')">
            <div class="top">
              <div class="num">${m.icon}</div>
              <div class="pct">${p}%</div>
            </div>
            <h3>Модуль ${m.id.slice(1)}: ${m.title}</h3>
            <p>${m.desc}</p>
            <div class="bar"><div class="fill" style="width:${p}%"></div></div>
          </div>`;
        }).join('')}
      </div>

      ${pct>=80?`
        <div style="margin-top:30px;text-align:center;padding:30px;background:linear-gradient(135deg,rgba(77,171,247,.1),rgba(124,92,255,.1));border:1px solid var(--accent);border-radius:12px">
          <h2 style="margin-bottom:10px">🎓 Вы готовы к сертификации!</h2>
          <p style="color:var(--text-dim);margin-bottom:16px">Завершите оставшиеся уроки или получите сертификат сейчас</p>
          <button class="btn-nav btn-next" onclick="showCert()">Получить сертификат</button>
        </div>
      `:''}
    </div>`;
  document.getElementById('mainContent').innerHTML=html;
  document.getElementById('sidebar').classList.remove('open');
}

function showFirstLesson(mid){
  const m=CURRICULUM.find(x=>x.id===mid);
  if(m&&m.lessons.length>0){
    loadLesson(m.lessons[0].id);
  }
}

/* ============ 8. КУРРИКУЛУМ В SIDEBAR ============ */
function renderCurriculum(){
  const c=document.getElementById('curriculum');
  c.innerHTML=CURRICULUM.map(m=>{
    const done=isModuleDone(m.id);
    const open=state.openModules.includes(m.id);
    return `
    <div class="module ${done?'done':''} ${open?'open':''}" id="mod-${m.id}">
      <div class="module-head" onclick="toggleModule('${m.id}')">
        <div class="num">${CURRICULUM.indexOf(m)+1}</div>
        <div>
          <div style="font-weight:600">${m.icon} ${m.title}</div>
          <div style="font-size:11px;color:var(--text-muted)">${moduleProgress(m.id)}%</div>
        </div>
        <div class="chev">▶</div>
      </div>
      <div class="module-body">
        ${m.lessons.map((l,i)=>{
          const ldone=isLessonDone(l.id);
          const active=state.currentLesson===l.id;
          return `<div class="lesson ${ldone?'done':''} ${active?'active':''}" onclick="loadLesson('${l.id}')">
            <span class="check"></span>${i+1}. ${l.title}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleModule(mid){
  if(state.openModules.includes(mid)){
    state.openModules=state.openModules.filter(x=>x!==mid);
  }else{
    state.openModules.push(mid);
  }
  localStorage.setItem('pycamp_open',JSON.stringify(state.openModules));
  const m=document.getElementById('mod-'+mid);
  m.classList.toggle('open');
}

function openModule(mid){
  if(!state.openModules.includes(mid)){
    state.openModules.push(mid);
    localStorage.setItem('pycamp_open',JSON.stringify(state.openModules));
  }
  const m=document.getElementById('mod-'+mid);
  if(m)m.classList.add('open');
}

/* ============ 9. ЗАГРУЗКА УРОКА ============ */
function loadLesson(lid){
  state.currentLesson=lid;
  const lesson=LESSONS[lid];
  if(!lesson){showDashboard();return;}

  // открыть модуль
  const mod=CURRICULUM.find(m=>m.lessons.some(l=>l.id===lid));
  if(mod)openModule(mod.id);

  const modIdx=CURRICULUM.indexOf(mod);
  const lessIdx=mod.lessons.findIndex(l=>l.id===lid);
  const hasNext=lessIdx<mod.lessons.length-1||modIdx<CURRICULUM.length-1;
  const hasPrev=lessIdx>0||modIdx>0;

  const isProject=lesson.body.includes('Финальный проект')||lesson.body.includes('Кульминация');

  const html=`
    <div class="content-area">
      <div class="lesson-pane">
        <div class="lesson-title">${lesson.title}</div>
        <div class="lesson-meta">
          <span>📘 Модуль ${modIdx+1}: ${mod.title}</span>
          <span class="dot"></span>
          <span>Урок ${lessIdx+1} из ${mod.lessons.length}</span>
          ${isProject?'<span class="dot"></span><span style="color:var(--accent)">🎯 Проект</span>':''}
        </div>
        <div class="lesson-body">${lesson.body}</div>

        <div class="actions-bar">
          <button class="btn-nav btn-prev" onclick="goPrev()" ${hasPrev?'':'disabled'}>← Назад</button>
          <div style="display:flex;gap:10px">
            <button class="btn-nav btn-prev" onclick="showDashboard()">🏠 На главную</button>
            <button class="btn-nav btn-next" id="nextBtn" onclick="goNext()" ${hasNext?'':'disabled'}>Вперёд →</button>
          </div>
        </div>
      </div>

      <div class="editor-pane">
        <div class="editor-tabs">
          <div class="editor-tab active">📝 code.py</div>
        </div>
        <div class="editor-wrap">
          <textarea class="editor-area" id="editor" spellcheck="false">${lesson.starter||''}</textarea>
          <div class="editor-toolbar">
            <button class="btn btn-run" onclick="runCode()">▶ Запустить</button>
            <button class="btn btn-reset" onclick="resetCode()">↺ Сброс</button>
            ${lesson.tests?`<button class="btn btn-hint" onclick="showHint()">💡 Подсказка</button>`:''}
            ${lesson.tests?`<button class="btn btn-solution" onclick="showSolution()">✓ Решение</button>`:''}
            <div class="editor-status">
              <span id="pyStatus" class="idle">Python: загрузка...</span>
            </div>
          </div>
        </div>
        <div class="output-wrap">
          <div class="output-head">
            <span>Консоль</span>
            <span class="clear" onclick="clearOutput()">очистить</span>
          </div>
          <div class="output-area" id="output">
            <div class="info">Нажмите «Запустить» для выполнения кода...</div>
          </div>
          ${lesson.tests?`
            <div class="test-results" id="testResults" style="display:none">
              <h4>Тесты</h4>
              <div id="testList"></div>
            </div>
          `:''}
        </div>
      </div>
    </div>`;

  document.getElementById('mainContent').innerHTML=html;
  renderCurriculum();

  // Загрузить Pyodide если ещё не загружен
  ensurePyodide();

  // Поддержка Tab в редакторе
  const editor=document.getElementById('editor');
  editor.addEventListener('keydown',handleEditorKeys);

  // Автосохранение
  const savedCode=localStorage.getItem('pycamp_code_'+lid);
  if(savedCode)editor.value=savedCode;
  editor.addEventListener('input',()=>{
    localStorage.setItem('pycamp_code_'+lid,editor.value);
  });
}

function handleEditorKeys(e){
  if(e.key==='Tab'){
    e.preventDefault();
    const start=e.target.selectionStart;
    const end=e.target.selectionEnd;
    e.target.value=e.target.value.substring(0,start)+'    '+e.target.value.substring(end);
    e.target.selectionStart=e.target.selectionEnd=start+4;
  }
}

/* ============ 10. PYODIDE ============ */
let pyodide=null;
async function ensurePyodide(){
  const status=document.getElementById('pyStatus');
  if(!status)return;

  if(pyodide){
    state.pyodideReady=true;
    status.className='ready';
    status.textContent='Python: готов';
    return;
  }

  if(state.pyodideLoading)return;
  state.pyodideLoading=true;
  status.className='loading';
  status.innerHTML='<span class="loader"></span> загрузка Python...';

  try{
    pyodide=await loadPyodide();
    state.pyodideReady=true;
    status.className='ready';
    status.textContent='Python: готов ✓';

    // Перенаправить вывод
    pyodide.setStdout({batched:(s)=>appendOutput(s,'out')});
    pyodide.setStderr({batched:(s)=>appendOutput(s,'err')});
  }catch(e){
    status.className='idle';
    status.textContent='Python: ошибка';
    appendOutput('Ошибка загрузки Python: '+e.message+'\n','err');
    state.pyodideLoading=false;
  }
}

function appendOutput(text,cls){
  const out=document.getElementById('output');
  if(!out)return;
  // Убрать начальное сообщение
  const info=out.querySelector('.info');
  if(info)info.remove();
  const div=document.createElement('div');
  div.className=cls||'out';
  div.textContent=text;
  out.appendChild(div);
  out.scrollTop=out.scrollHeight;
}

function clearOutput(){
  document.getElementById('output').innerHTML='<div class="info">Очищено...</div>';
}

async function runCode(){
  if(!pyodide){
    appendOutput('Python ещё загружается, подождите...\n','err');
    await ensurePyodide();
    if(!pyodide)return;
  }

  const code=document.getElementById('editor').value;
  const lesson=LESSONS[state.currentLesson];

  // Очистить вывод
  document.getElementById('output').innerHTML='';

  // Установить input если нужен
  let runCode=code;
  if(lesson.tests&&lesson.tests.some(t=>t.input)){
    // Найти первый input с тестовыми данными
    const inputTest=lesson.tests.find(t=>t.input);
    if(inputTest){
      // Эмулировать input
      const inputs=inputTest.input.split('\\n');
      let inputIdx=0;
      pyodide.setStdin({stdin:()=>{
        if(inputIdx<inputs.length){
          return inputs[inputIdx++];
        }
        return '';
      }});
    }
  }else{
    pyodide.setStdin({stdin:()=>''});
  }

  try{
    await pyodide.runPythonAsync(code);

    // Прогнать тесты
    if(lesson.tests){
      await runTests(code,lesson.tests);
    }
  }catch(e){
    appendOutput(e.message+'\n','err');
  }
}

async function runTests(code,tests){
  const testList=document.getElementById('testList');
  const testResults=document.getElementById('testResults');
  testResults.style.display='block';
  testList.innerHTML='';

  let allPassed=true;
  let outputs=[];

  for(let i=0;i<tests.length;i++){
    const test=tests[i];
    const div=document.createElement('div');
    div.className='test-item';

    // Перенаправить stdout в массив
    let capturedOutput='';
    const origStdout=pyodide.stdout;
    pyodide.setStdout({batched:(s)=>{capturedOutput+=s;}});

    // Установить input
    if(test.input){
      const inputs=test.input.split('\\n');
      let idx=0;
      pyodide.setStdin({stdin:()=>{
        if(idx<inputs.length)return inputs[idx++];
        return '';
      }});
    }else{
      pyodide.setStdin({stdin:()=>''});
    }

    let passed=false;
    try{
      // Очистить предыдущие переменные
      await pyodide.runPythonAsync('import sys; sys.stdout.flush()');
      await pyodide.runPythonAsync(code);
      passed=test.fn(capturedOutput,test.input);
      outputs.push(capturedOutput);
    }catch(e){
      passed=false;
      capturedOutput+=e.message;
      outputs.push(capturedOutput);
    }

    // Восстановить stdout
    pyodide.setStdout({batched:(s)=>appendOutput(s,'out')});

    if(!passed)allPassed=false;

    div.innerHTML=`<div class="icon ${passed?'pass':'fail'}">${passed?'✓':'✗'}</div> Тест ${i+1}: ${passed?'пройден':'не пройден'}`;
    testList.appendChild(div);
  }

  // Восстановить нормальный stdout и вывести первый результат
  pyodide.setStdout({batched:(s)=>appendOutput(s,'out')});
  if(outputs[0])appendOutput(outputs[0],'out');

  if(allPassed){
    appendOutput('\n✓ Все тесты пройдены! Урок завершён.\n','ok');
    markDone(state.currentLesson);
  }else{
    appendOutput('\n✗ Некоторые тесты не пройдены. Попробуйте ещё раз.\n','err');
  }
}

/* ============ 11. ПОДСКАЗКИ ============ */
function showHint(){
  const lesson=LESSONS[state.currentLesson];
  if(!lesson.tests)return;
  const hint=lesson.tests[0].hint||'Подсказки недоступны для этого урока';
  alert('💡 Подсказка:\n\n'+hint);
}
function showSolution(){
  const lesson=LESSONS[state.currentLesson];
  if(!lesson.tests)return;
  const hint=lesson.tests[0].hint||'';
  if(hint&&!confirm('Показать решение? Постарайтесь сначала решить сами!'))return;
  // Извлечь решение из подсказки
  const match=hint.match(/hint:'(.+)'/s)||hint.match(/'(.+)'/s);
  if(match){
    document.getElementById('editor').value=match[1].replace(/\\n/g,'\n');
  }else{
    alert('Решение:\n'+hint);
  }
}
function resetCode(){
  const lesson=LESSONS[state.currentLesson];
  if(lesson&&lesson.starter){
    document.getElementById('editor').value=lesson.starter;
    localStorage.removeItem('pycamp_code_'+state.currentLesson);
  }
}

/* ============ 12. НАВИГАЦИЯ ============ */
function goNext(){
  const lid=state.currentLesson;
  if(!lid)return;
  const mod=CURRICULUM.find(m=>m.lessons.some(l=>l.id===lid));
  const lessIdx=mod.lessons.findIndex(l=>l.id===lid);
  const modIdx=CURRICULUM.indexOf(mod);

  if(lessIdx<mod.lessons.length-1){
    loadLesson(mod.lessons[lessIdx+1].id);
  }else if(modIdx<CURRICULUM.length-1){
    const nextMod=CURRICULUM[modIdx+1];
    loadLesson(nextMod.lessons[0].id);
  }
}
function goPrev(){
  const lid=state.currentLesson;
  if(!lid)return;
  const mod=CURRICULUM.find(m=>m.lessons.some(l=>l.id===lid));
  const lessIdx=mod.lessons.findIndex(l=>l.id===lid);
  const modIdx=CURRICULUM.indexOf(mod);

  if(lessIdx>0){
    loadLesson(mod.lessons[lessIdx-1].id);
  }else if(modIdx>0){
    const prevMod=CURRICULUM[modIdx-1];
    loadLesson(prevMod.lessons[prevMod.lessons.length-1].id);
  }
}

/* ============ 13. СЕРТИФИКАТ ============ */
function showCert(){
  const total=countLessons();
  const done=countCompleted();
  const pct=Math.round(done/total*100);

  if(pct<80){
    if(!confirm(`Вы прошли ${pct}% курса. Для получения сертификата нужно минимум 80%. Всё равно показать сертификат?`))return;
  }

  if(!state.studentName){
    const name=prompt('Введите ваше имя для сертификата:');
    if(name){
      state.studentName=name;
      localStorage.setItem('pycamp_name',name);
    }else{return;}
  }

  document.getElementById('certName').textContent=state.studentName;
  const d=new Date();
  const months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  document.getElementById('certDate').textContent=`Дата выдачи: ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} года`;
  document.getElementById('certModal').classList.add('open');
}
function closeCert(){
  document.getElementById('certModal').classList.remove('open');
}

/* ============ 14. MOBILE MENU ============ */
document.getElementById('menuToggle').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

/* ============ 15. ЗАПУСК ============ */
init();
</script>
