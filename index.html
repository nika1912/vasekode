<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interfaces — Nika1912</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 640px;
            width: 100%;
            padding: 40px 24px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #e6edf3;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 36px;
            font-size: 0.95rem;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            text-decoration: none;
            color: #c9d1d9;
            transition: all 0.2s ease;
        }

        nav a:hover {
            background: #1c2333;
            border-color: #58a6ff;
            transform: translateX(4px);
        }

        nav a .icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        nav a .info {
            flex: 1;
        }

        nav a .name {
            font-weight: 600;
            font-size: 1rem;
            color: #e6edf3;
        }

        nav a .desc {
            font-size: 0.82rem;
            color: #8b949e;
            margin-top: 2px;
        }

        /* Цвета иконок */
        .icon-deepseek  { background: #1a3a5c; color: #58a6ff; }
        .icon-gigachat  { background: #2d1a4c; color: #bc8cff; }
        .icon-qwen      { background: #1a3c2e; color: #3fb950; }
        .icon-index     { background: #3c2a1a; color: #d29922; }

        footer {
            text-align: center;
            margin-top: 36px;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Chat Interfaces</h1>
        <p class="subtitle">Репозиторий nika1912 — навигация по проектам</p>

        <nav>
            <a href="deepseek.html">
                <span class="icon icon-deepseek">💬</span>
                <span class="info">
                    <span class="name">DeepSeek</span>
                    <span class="desc">Интерфейс чата DeepSeek</span>
                </span>
            </a>

            <a href="deepseek_cod.html">
                <span class="icon icon-deepseek">💻</span>
                <span class="info">
                    <span class="name">DeepSeek Coder</span>
                    <span class="desc">Интерфейс для кодинга</span>
                </span>
            </a>

            <a href="gigachat.html">
                <span class="icon icon-gigachat">🧠</span>
                <span class="info">
                    <span class="name">GigaChat</span>
                    <span class="desc">Интерфейс чата GigaChat</span>
                </span>
            </a>

            <a href="qwen.html">
                <span class="icon icon-qwen">🐉</span>
                <span class="info">
                    <span class="name">Qwen</span>
                    <span class="desc">Интерфейс чата Qwen</span>
                </span>
            </a>

            <a href="qwen_agent.html">
                <span class="icon icon-qwen">️</span>
                <span class="info">
                    <span class="name">Qwen Agent</span>
                    <span class="desc">Агент на базе Qwen</span>
                </span>
            </a>

            <a href="qwen_web.html">
                <span class="icon icon-qwen">🌐</span>
                <span class="info">
                    <span class="name">Qwen Web</span>
                    <span class="desc">Веб-интерфейс Qwen</span>
                </span>
            </a>
        </nav>

        <footer>
            GitHub: <strong>nika1912</strong> · 11 коммитов
        </footer>
    </div>
</body>
</html>
