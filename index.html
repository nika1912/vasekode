<<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PythonCamp — Полный курс Python</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e27;
    --bg-2: #151935;
    --bg-3: #1e2447;
    --accent: #00d084;
    --accent-2: #ffd700;
    --text: #e8eaf6;
    --text-dim: #9ca3c7;
    --danger: #ff5370;
    --border: #2a3158;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .progress-bar {
    flex: 1;
    max-width: 400px;
    margin: 0 24px;
    height: 8px;
    background: var(--bg-3);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.4s;
    width: 0%;
  }
  .stats { font-size: 14px; color: var(--text-dim); }
  .stats b { color: var(--accent); }

  .container {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .sidebar {
    width: 320px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  .sidebar h3 {
    padding: 8px 20px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
  }
  .lesson-item {
    padding: 12px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .lesson-item:hover { background: var(--bg-3); }
  .lesson-item.active {
    background: var(--bg-3);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .lesson-item.completed .check { color: var(--accent); }
  .check {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .lesson-item.completed .check {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px;
    max-width: 800px;
  }
  .content h1 {
    color: var(--accent);
    margin-bottom: 8px;
    font-size: 28px;
  }
  .content h2 {
    color: var(--accent-2);
    margin: 24px 0 12px;
    font-size: 20px;
  }
  .content h3 {
    color: var(--text);
    margin: 16px 0 8px;
    font-size: 16px;
  }
  .content p {
    line-height: 1.7;
    margin-bottom: 12px;
    color: var(--text);
  }
  .content code {
    background: var(--bg-3);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent);
    font-family: "Consolas", "Monaco", monospace;
    font-size: 14px;
  }
  .content pre {
    background: var(--bg-3);
    border-left: 3px solid var(--accent);
    padding: 16px;
    border-radius: 4px;
    margin: 12px 0;
    overflow-x: auto;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  .content ul, .content ol {
    margin: 12px 0 12px 24px;
    line-height: 1.7;
  }
  .content li { margin-bottom: 6px; }
  .task-box {
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent-2);
    padding: 16px 20px;
    border-radius: 6px;
    margin: 20px 0;
  }
  .task-box h3 {
    color: var(--accent-2);
    margin-bottom: 8px;
  }
  .task-list { margin-top: 8px; }
  .task-list li {
    list-style: none;
    padding: 4px 0;
    font-size: 14px;
  }
  .task-list li::before {
    content: "☐ ";
    color: var(--text-dim);
  }
  .task-list li.pass::before {
    content: "✓ ";
    color: var(--accent);
  }
  .task-list li.fail::before {
    content: "✗ ";
    color: var(--danger);
  }

  .editor-panel {
    width: 45%;
    min-width: 400px;
    display: flex;
    flex-direction: column;
    background: var(--bg-2);
    border-left: 1px solid var(--border);
  }
  .editor-toolbar {
    padding: 10px 16px;
    background: var(--bg-3);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: var(--bg-3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-danger { background: var(--danger); color: white; }
  .editor {
    flex: 1;
    background: #0d1117;
    color: #e6edf3;
    font-family: "Consolas", "Monaco", "Courier New", monospace;
    font-size: 14px;
    line-height: 1.6;
    padding: 16px;
    border: none;
    outline: none;
    resize: none;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
  }
  .output {
    height: 180px;
    background: #000;
    color: #00ff88;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 13px;
    padding: 12px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .output.error { color: var(--danger); }
  .output-header {
    padding: 6px 12px;
    background: var(--bg-3);
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-top: 1px solid var(--border);
  }
  .loader {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
  }
  .spinner {
    width: 60px; height: 60px;
    border: 4px solid var(--bg-3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }

  .sidebar::-webkit-scrollbar, .content::-webkit-scrollbar, .editor::-webkit-scrollbar, .output::-webkit-scrollbar {
    width: 10px;
  }
  .sidebar::-webkit-scrollbar-track, .content::-webkit-scrollbar-track { background: var(--bg-2); }
  .sidebar::-webkit-scrollbar-thumb, .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  @media (max-width: 900px) {
    .sidebar { width: 220px; }
    .editor-panel { min-width: 300px; }
    .content { padding: 20px; }
  }
  @media (max-width: 700px) {
    .container { flex-direction: column; }
    .sidebar { width: 100%; max-height: 40vh; }
    .main { flex-direction: column; }
    .editor-panel { width: 100%; min-width: 0; }
    .progress-bar { display: none; }
  }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="logo-icon">🐍</div>
  <div style="font-size: 24px; font-weight: 700;">PythonCamp</div>
  <div class="spinner"></div>
  <div id="loader-text" style="color: var(--text-dim);">Загрузка интерпретатора Python...</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">🐍</div>
    <div>PythonCamp</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="stats">Пройдено: <b id="completedCount">0</b> / <b id="totalCount">0</b></div>
</header>

<div class="container">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <section class="content" id="content"></section>
    <section class="editor-panel">
      <div class="editor-toolbar">
        <button class="btn" id="runBtn" disabled>▶ Запустить</button>
        <button class="btn btn-secondary" id="checkBtn" disabled>✓ Проверить</button>
        <button class="btn btn-secondary" id="resetBtn">↺ Сброс</button>
        <button class="btn btn-secondary" id="solutionBtn">💡 Решение</button>
      </div>
      <textarea class="editor" id="editor" spellcheck="false" placeholder="# Напишите код на Python..."></textarea>
      <div class="output-header">Консоль вывода</div>
      <div class="output" id="output">Готово к работе.</div>
    </section>
  </main>
</div>

<script>
// ==================== СТРУКТУРА КУРСА ====================
const COURSE = [
  {
    id: 'intro',
    title: '0. Введение в Python',
    theory: `
      <h1>Добро пожаловать в PythonCamp!</h1>
      <p><b>Python</b> — это высокоуровневый язык программирования, созданный Гвидо ван Россумом в 1991 году. Он известен своим чистым синтаксисом и читаемостью кода.</p>
      <h2>Почему Python?</h2>
      <ul>
        <li>Простой и понятный синтаксис</li>
        <li>Используется в веб-разработке, Data Science, AI, автоматизации</li>
        <li>Огромное сообщество и библиотека пакетов</li>
        <li>Подходит как новичкам, так и профессионалам</li>
      </ul>
      <h2>Ваша первая программа</h2>
      <p>Традиционно первая программа на любом языке — вывод текста "Hello, World!". В Python это делается одной строкой:</p>
      <pre>print("Hello, World!")</pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Выведите на экран фразу <code>Hello, Python!</code></p>
        <ul class="task-list" id="taskList"></ul>
      </div>
    `,
    starter: '# Напишите ваш первый код здесь\n',
    tests: [
      { name: 'Программа выводит "Hello, Python!"', check: (out) => out.trim() === 'Hello, Python!' }
    ]
  },
  {
    id: 'variables',
    title: '1. Переменные и типы данных',
    theory: `
      <h1>Переменные и типы данных</h1>
      <p><b>Переменная</b> — это именованная ячейка памяти для хранения данных. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
      <pre>name = "Alice"      # строка (str)
age = 25            # целое число (int)
height = 1.68       # дробное число (float)
is_student = True   # логический тип (bool)</pre>
      <h2>Основные типы данных</h2>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"Привет"</code>, <code>'Мир'</code></li>
        <li><code>bool</code> — логические: <code>True</code>, <code>False</code></li>
        <li><code>NoneType</code> — отсутствие значения: <code>None</code></li>
      </ul>
      <h2>Функция type()</h2>
      <p>Узнать тип переменной можно с помощью <code>type()</code>:</p>
      <pre>x = 10
print(type(x))  # &lt;class 'int'&gt;</pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Создайте переменные <code>name</code> со значением <code>"Python"</code> и <code>year</code> со значением <code>1991</code>. Выведите их через пробел.</p>
        <ul class="task-list" id="taskList"></ul>
      </div>
    `,
    starter: '# Создайте переменные name и year\n# Выведите их через пробел\n',
    tests: [
      { name: 'Переменная name существует и равна "Python"', check: (out, ctx) => ctx.get('name') === 'Python' },
      { name: 'Переменная year существует и равна 1991', check: (out, ctx) => ctx.get('year') === 1991 },
      { name: 'Вывод содержит "Python 1991"', check: (out) => out.trim() === 'Python 1991' }
    ]
  },
  {
    id: 'operators',
    title: '2. Операторы',
    theory: `
      <h1>Операторы в Python</h1>
      <h2>Арифметические операторы</h2>
      <pre>a = 10
b = 3
print(a + b)   # 13  сложение
print(a - b)   # 7   вычитание
print(a * b)   # 30  умножение
print(a / b)   # 3.333... деление
print(a // b)  # 3   целочисленное деление
print(a % b)   # 1   остаток от деления
print(a ** b)  # 1000 возведение в степень</pre>
      <h2>Операторы сравнения</h2>
      <pre>x = 5
print(x == 5)  # True  равно
print(x != 5)  # False не равно
print(x > 3)   # True  больше
print(x < 3)   # False меньше
print(x >= 5)  # True  больше или равно
print(x <= 4)  # False меньше или равно</pre>
      <h2>Логические операторы</h2>
      <pre>print(True and False)  # False
print(True or False)   # True
print(not True)        # False</pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Даны два числа: <code>a = 17</code> и <code>b = 5</code>. Выведите в отдельных строках: сумму, остаток от деления a на b, и результат a в степени b.</p>
        <ul class="task-list" id="taskList"></ul>
      </div>
    `,
    starter: 'a = 17\nb = 5\n# Выведите сумму, остаток от деления и a**b\n',
    tests: [
      { name: 'Выведена сумма (22)', check: (out) => out.includes('22') },
      { name: 'Выведен остаток (2)', check: (out) => out.includes('2') },
      { name: 'Выведена степень (1419857)', check: (out) => out.includes('1419857') }
    ]
  },
  {
    id: 'strings',
    title: '3. Строки',
    theory: `
      <h1>Работа со строками</h1>
      <p>Строка — это последовательность символов. В Python строки неизменяемы.</p>
      <pre>s = "Hello"
print(len(s))      # 5 — длина строки
print(s[0])        # H — первый символ
print(s[-1])       # o — последний символ
print(s[1:4])      # ell — срез с 1 по 3 индекс</pre>
      <h2>Конкатенация и форматирование</h2>
      <pre>name = "Alice"
age = 25
# Способ 1: конкатенация
print("Меня зовут " + name)
# Способ 2: f-строки (современный)
print(f"Меня зовут {name}, мне {age} лет")
# Способ 3: format
print("Меня зовут {}, мне {} лет".format(name, age))</pre>
      <h2>Полезные методы строк</h2>
      <pre>s = "Hello, World!"
print(s.upper())       # HELLO, WORLD!
print(s.lower())       # hello, world!
print(s.replace("Hello", "Hi"))  # Hi, World!
print(s.split(", "))   # ['Hello', 'World!']
print(s.startswith("He"))  # True
print("World" in s)    # True</pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Создайте переменные <code>first_name = "john"</code> и <code>last_name = "doe"</code>. Выведите полное имя с заглавной буквы в формате: <code>John Doe</code></p>
        <ul class="task-list" id="taskList"></ul>
      </div>
    `,
    starter: 'first_name = "john"\nlast_name = "doe"\n# Выведите "John Doe"\n',
    tests: [
      { name: 'Вывод равен "John Doe"', check: (out) => out.trim() === 'John Doe' }
    ]
  },
  {
    id: 'input',
    title: '4. Ввод и преобразование типов',
    theory: `
      <h1>Ввод данных и преобразование типов</h1>
      <p>Функция <code>input()</code> считывает строку с клавиатуры. В нашей среде она использует предустановленные значения.</p>
      <pre>name = input("Введите имя: ")
print(f"Привет, {name}!")</pre>
      <h2>Преобразование типов</h2>
      <pre># str -> int
age = int("25")
# str -> float
price = float("19.99")
# int/float -> str
text = str(42)
# В булев тип
bool(0)       # False
bool("")      # False
bool("hello") # True
bool(42)      # True</pre>
      <h2>Пример: программа-калькулятор</h2>
      <pre>a = int(input())
b = int(input())
print(f"{a} + {b} = {a + b}")</pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Прочитайте число <code>n</code> через <code>input()</code> и выведите его квадрат. (В нашей среде input() вернёт "7")</p>
        <ul class="task-list" id="taskList"></ul>
      </div>
    `,
    starter: '# Прочитайте число и выведите его квадрат\n',
    tests: [
      { name: 'Вывод равен 49 (квадрат 7)', check: (out) => out.trim() === '49' }
    ],
    mockInput: ['7']
  },
  {
    id: 'conditions',
    title: '5. Условные операторы',
    theory: `
      <h1>Условные операторы if/elif/else</h1>
      <p>Условные операторы позволяют выполнять разный код в зависимости от условий.</p>
      <pre>age = 18
if age >= 18:
    print("Совершеннолетний")
elif age >= 14:
    print("Подросток")
else:
    print("Ребёнок")</pre>
      <h2>Вложенные условия</h2>
      <pre>x = 10
if x > 0:
    if x % 2 == 0:
        print("Положительное чётное")
    else:
        print("Положительное нечётное")</pre>
      <h2>Тернарный оператор</h2>
      <pre>age = 20
status = "взрослый" if age >= 18 else "ребёнок"
print(status)</pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Дана переменная <code>score = 85</code>. Выведите оценку по шкале: 90-100 → "A", 75-89 → "B", 60-74 → "C", иначе → "F"</p>
        <ul class="task-list" id="taskList"></ul>
      </div>
    `,
    starter: 'score = 85\n# Выведите оценку\n',
    tests: [
      { name: 'Для score=85 выводится "B"', check: (out) => out.trim() === 'B' }
    ]
  },
  {
    id: 'loops_for',
    title: '6. Цикл for',
    theory: `
      <h1>Цикл for</h1>
      <p>Цикл <code>for</code> перебирает элементы последовательности.</p>
      <pre># Перебор списка
fruits = ["apple", "banana", "cherry"]
for fruit in fruits:
    print(fruit)</pre>
      <h2>Функция range()</h2>
      <pre>for i in range(5):       # 0, 1, 2, 3, 4
    print(i)

for i in range(2, 6):    # 2, 3, 4, 5
    print(i)

for i in range(0, 10, 2):  # 0, 2, 4, 6, 8
    print(i)</pre>
      <h2>Перебор строки</h2>
      <pre>for char in "Python":
    print(char, end=" ")  # P y t h o n</pre>
      <h2>Функции break и continue</h2>
      <pre>for i in range(10):
    if i == 5:
        break       # прерывает цикл
    if i % 2 == 0:
        continue    # пропускает итерацию
    print(i)        # выведет 1, 3</pre>
      <div class="task-box">
        <h3>🎯 Задание</h3>
        <p>Выведите сумму всех чисел от 1 до 100 включительно.</p>
        <ul class="task-list" id="taskList"></ul>
      </div>
    `,
    starter: '# Выведите сумму чисел от 1 до 100\n',
    tests: [
      { name: 'Сумма равна 5050', check: (out) => out.trim() === '5050' }
    ]

let pyodide = null;
let currentLesson = 0;
let completed = JSON.parse(localStorage.getItem('pythoncamp_completed') || '[]');

// ==================== ИНИЦИАЛИЗАЦИЯ PYODIDE ====================
async function loadPyodideRuntime() {
  const loaderText = document.getElementById('loader-text');
  try {
    loaderText.textContent = 'Загрузка Pyodide...';
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
    loaderText.textContent = 'Инициализация интерпретатора Python...';
    pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/' });
    
    // Перехватываем stdout/stderr
    pyodide.runPython(`
import sys
from io import StringIO

class OutputCapture:
    def __init__(self):
        self.outputs = []
    def write(self, text):
        self.outputs.append(text)
    def flush(self):
        pass
    def getvalue(self):
        return ''.join(self.outputs)
    def clear(self):
        self.outputs = []

_stdout = OutputCapture()
_stderr = OutputCapture()
sys.stdout = _stdout
sys.stderr = _stderr

_input_values = []
_input_index = 0

def _mock_input(prompt=""):
    global _input_index
    if _input_index < len(_input_values):
        val = _input_values[_input_index]
        _input_index += 1
        return val
    return ""

import builtins
builtins.input = _mock_input
    `);
    
    loaderText.textContent = 'Готово!';
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
      initApp();
    }, 300);
  } catch (e) {
    loaderText.textContent = 'Ошибка загрузки: ' + e.message;
    console.error(e);
  }
}

// ==================== ПРИЛОЖЕНИЕ ====================
function initApp() {
  renderSidebar();
  selectLesson(0);
  updateProgress();
  document.getElementById('totalCount').textContent = COURSE.length;
  
  document.getElementById('runBtn').disabled = false;
  document.getElementById('checkBtn').disabled = false;
  document.getElementById('runBtn').onclick = runCode;
  document.getElementById('checkBtn').onclick = checkCode;
  document.getElementById('resetBtn').onclick = resetCode;
  document.getElementById('solutionBtn').onclick = showSolution;
  
  // Обработка Tab в редакторе
  const editor = document.getElementById('editor');
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 4;
    }
    // Ctrl+Enter для запуска
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
  });
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<h3>Уроки курса</h3>';
  COURSE.forEach((lesson, i) => {
    const item = document.createElement('div');
    item.className = 'lesson-item';
    if (completed.includes(lesson.id)) item.classList.add('completed');
    item.innerHTML = `
      <div class="check">${completed.includes(lesson.id) ? '✓' : ''}</div>
      <div>${lesson.title}</div>
    `;
    item.onclick = () => selectLesson(i);
    sidebar.appendChild(item);
  });
}

function selectLesson(index) {
  currentLesson = index;
  const lesson = COURSE[index];
  
  // Обновляем сайдбар
  document.querySelectorAll('.lesson-item').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  
  // Обновляем содержимое
  document.getElementById('content').innerHTML = lesson.theory;
  
  // Восстанавливаем код или используем стартовый
  const savedCode = localStorage.getItem(`pythoncamp_code_${lesson.id}`);
  document.getElementById('editor').value = savedCode || lesson.starter;
  
  // Очищаем вывод
  document.getElementById('output').textContent = 'Готово к работе.';
  document.getElementById('output').classList.remove('error');
  
  // Рендерим список задач
  renderTaskList();
  
  // Прокрутка контента вверх
  document.getElementById('content').scrollTop = 0;
}

function renderTaskList() {
  const lesson = COURSE[currentLesson];
  const taskList = document.getElementById('taskList');
  if (!taskList) return;
  taskList.innerHTML = '';
  lesson.tests.forEach(test => {
    const li = document.createElement('li');
    li.textContent = test.name;
    taskList.appendChild(li);
  });
}

async function runCode() {
  const code = document.getElementById('editor').value;
  const output = document.getElementById('output');
  output.classList.remove('error');
  output.textContent = 'Выполнение...';
  
  // Сохраняем код
  const lesson = COURSE[currentLesson];
  localStorage.setItem(`pythoncamp_code_${lesson.id}`, code);
  
  try {
    // Сброс вывода и input
    pyodide.runPython(`
_stdout.clear()
_stderr.clear()
_input_index = 0
_input_values = ${JSON.stringify(lesson.mockInput || [])}
`);
    
    // Выполняем код
    await pyodide.runPythonAsync(code);
    
    // Получаем вывод
    const stdout = pyodide.runPython('_stdout.getvalue()');
    const stderr = pyodide.runPython('_stderr.getvalue()');
    
    if (stderr) {
      output.textContent = stderr;
      output.classList.add('error');
    } else {
      output.textContent = stdout || '(нет вывода)';
    }
  } catch (e) {
    output.textContent = 'Ошибка: ' + e.message;
    output.classList.add('error');
  }
}

async function checkCode() {
  const code = document.getElementById('editor').value;
  const lesson = COURSE[currentLesson];
  const output = document.getElementById('output');
  output.classList.remove('error');
  output.textContent = 'Проверка...';
  
  try {
    // Сброс
    pyodide.runPython(`
_stdout.clear()
_stderr.clear()
_input_index = 0
_input_values = ${JSON.stringify(lesson.mockInput || [])}
`);
    
    await pyodide.runPythonAsync(code);
    const stdout = pyodide.runPython('_stdout.getvalue()');
    
    // Получаем контекст (переменные)
    const globals = pyodide.globals.get('__builtins__');
    const ctx = {
      get: (name) => {
        try {
          const val = pyodide.globals.get(name);
          if (val === undefined || val === null) return undefined;
          if (typeof val === 'object' && val.toJs) {
            try { return val.toJs(); } catch(e) { return val.toString(); }
          }
          return val;
        } catch(e) { return undefined; }
      }
    };
    
    // Проверяем тесты
    const taskList = document.getElementById('taskList');
    const items = taskList.querySelectorAll('li');
    let allPassed = true;
    let results = [];
    
    lesson.tests.forEach((test, i) => {
      let passed = false;
      try {
        passed = test.check(stdout, ctx);
      } catch(e) {
        passed = false;
      }
      if (items[i]) {
        items[i].classList.remove('pass', 'fail');
        items[i].classList.add(passed ? 'pass' : 'fail');
      }
      results.push({ name: test.name, passed });
      if (!passed) allPassed = false;
    });
    
    // Выводим результат
    let resultText = '=== РЕЗУЛЬТАТЫ ПРОВЕРКИ ===\n\n';
    results.forEach(r => {
      resultText += (r.passed ? '✓ ' : '✗ ') + r.name + '\n';
    });
    resultText += '\n--- Вывод программы ---\n' + (stdout || '(нет вывода)');
    
    output.textContent = resultText;
    
    if (allPassed) {
      // Помечаем урок как пройденный
      if (!completed.includes(lesson.id)) {
        completed.push(lesson.id);
        localStorage.setItem('pythoncamp_completed', JSON.stringify(completed));
        updateProgress();
        renderSidebar();
        // Возвращаем активный стиль
        document.querySelectorAll('.lesson-item')[currentLesson].classList.add('active');
      }
      output.textContent += '\n\n🎉 ОТЛИЧНО! Все тесты пройдены!';
      
      // Автопереход на следующий урок через 2 секунды
      if (currentLesson < COURSE.length - 1) {
        setTimeout(() => {
          if (confirm('Все тесты пройдены! Перейти к следующему уроку?')) {
            selectLesson(currentLesson + 1);
          }
        }, 1500);
      } else {
        output.textContent += '\n\n🏆 ВЫ ПРОШЛИ ВЕСЬ КУРС! Поздравляем!';
      }
    }
  } catch (e) {
    output.textContent = 'Ошибка выполнения: ' + e.message;
    output.classList.add('error');
  }
}

function resetCode() {

  document.getElementById('output').textContent = 'Код сброшен.';
