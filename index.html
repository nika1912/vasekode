<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигация по проектам</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #24292e;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 1rem;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 0.5rem;
        }

        a {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            text-decoration: none;
            color: #0366d6;
            background-color: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        a:hover {
            background-color: #f1f8ff;
            border-color: #0366d6;
            transform: translateY(-1px);
        }

        /* Иконка файла перед названием */
        a::before {
            content: "📄";
            margin-right: 10px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Список файлов</h1>

            <li><a href="qwen.html">qwen.html</a></li>
            <li><a href="qwen_agent.html">qwen_agent.html</a></li>
            <li><a href="qwen_web.html">qwen_web.html</a></li>
        </ul>
    </div>

</body>
</html>
