    <title>Навигация по проектам</title>
    <style>
        :root {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-color: #24292f;
            --link-color: #0969da;
            --border-color: #d0d7de;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 3px 6px rgba(140, 149, 159, 0.15);
            padding: 24px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .file-list li {
            margin-bottom: 10px;
        }

        .file-list li:last-child {
            margin-bottom: 0;
        }

        .file-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .file-link:hover {
            border-color: var(--link-color);
            color: var(--link-color);
            background-color: #f3f6fc;
            transform: translateY(-1px);
        }

        .icon {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            fill: currentColor;
            opacity: 0.7;
        }
    </style>
</head>
